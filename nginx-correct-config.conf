server {
    listen 80;
    server_name 8.138.110.109;
    
    access_log /www/wwwlogs/wallpaper_access.log;
    error_log /www/wwwlogs/wallpaper_error.log;
    
    # 🔥 关键配置：API代理
    # 当请求 /api/home/data 时：
    # - Nginx接收: /api/home/data
    # - 转发给后端: http://127.0.0.1:9999/api/home/data
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 前端静态文件
    root /www/wwwroot/wallpaper-h5;
    index index.html index.htm;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
}
