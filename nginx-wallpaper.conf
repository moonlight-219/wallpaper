server {
    listen 80;
    server_name 8.138.110.109;  # 改成你的服务器IP或域名
    
    # 日志
    access_log /www/wwwlogs/wallpaper_access.log;
    error_log /www/wwwlogs/wallpaper_error.log;
    
    # API 反向代理（CORS由后端统一处理）
    location /api/ {
        # 反向代理到后端
        proxy_pass http://127.0.0.1:9999/api/;

        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重要：所有请求（包括OPTIONS）都转发给后端
        # 后端CorsConfig.java 会统一处理CORS逻辑
        # 避免在此处重复设置CORS头导致冲突
    }
    
    # 健康检查
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
