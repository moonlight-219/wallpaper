# 简化配置文件（直接修改值，不使用环境变量）
# 使用方式：java -jar app.jar --spring.config.name=application-simple

server:
  port: 9999
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: wallpaper-server

  datasource:
    # 请根据实际情况修改
    url: jdbc:mysql://localhost:3306/wallpaper_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: simple

logging:
  level:
    com.wallpaper.server: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

jwt:
  secret: wallpaper-server-local-jwt-secret-key-for-development-only-256bits
  expiration: 15552000000

aliyun:
  oss:
    enabled: true
    endpoint: oss-cn-beijing.aliyuncs.com
    # 请替换为你的阿里云 OSS 配置
    access-key-id: your-access-key-id
    access-key-secret: your-access-key-secret
    bucket-name: wallpaper-project
    url-prefix: https://wallpaper-project.oss-cn-beijing.aliyuncs.com

wechat:
  miniprogram:
    # 请替换为你的微信小程序配置
    app-id: wx7db99e78f00f1ce0
    app-secret: ee45b17d6eab40877d1b0bef5ff328c3
