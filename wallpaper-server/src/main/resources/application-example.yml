server:
  port: 9999
  servlet:
    context-path: /api

spring:
  application:
    name: wallpaper-server

  datasource:
    url: jdbc:mysql://localhost:3306/wallpaper?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: your_password_here
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.wallpaper.server: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

jwt:
  secret: your-jwt-secret-key-must-be-at-least-256-bits-long
  expiration: 15552000000

aliyun:
  oss:
    enabled: true
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: your_access_key_id_here
    access-key-secret: your_access_key_secret_here
    bucket-name: wallpaper-project
    url-prefix: https://wallpaper-project.oss-cn-beijing.aliyuncs.com
