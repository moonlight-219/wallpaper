components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token认证，格式为 `Bearer <token>`
  schemas:
    Result:
      type: object
      properties:
        code:
          type: integer
          example: 200
          description: 状态码（200成功，其他为错误码）
        message:
          type: string
          example: success
          description: 返回消息
        data:
          type: object
          nullable: true
          description: 返回数据

    UserStats:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: user123
        nickname:
          type: string
          example: 小明
        avatar:
          type: string
          example: /static/images/avatar1.jpg
        role:
          type: string
          example: user
        isCreator:
          type: boolean
          example: true
        followerCount:
          type: integer
          example: 100
        workCount:
          type: integer
          example: 10
        totalLikes:
          type: integer
          example: 500
        totalCollects:
          type: integer
          example: 200
        bio:
          type: string
          example: 个人简介

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        role:
          type: string
          example: user
        isCreator:
          type: boolean
          example: true
        loginType:
          type: string
          example: wechat
        wechatOpenId:
          type: string
          example: wx_openid_123456
        username:
          type: string
          example: user123
        password:
          type: string
          example: password123
        nickname:
          type: string
          example: 小明
        avatar:
          type: string
          example: /static/images/avatar1.jpg
        followerCount:
          type: integer
          example: 100
        workCount:
          type: integer
          example: 10
        bio:
          type: string
          example: 个人简介
        phone:
          type: string
          example: 13800138000
        email:
          type: string
          example: user@example.com
        createTime:
          type: string
          format: date-time
          example: 2026-03-16T10:00:00
        updateTime:
          type: string
          format: date-time
          example: 2026-03-16T10:00:00
        isDel:
          type: boolean
          example: false

    PageResult:
      type: object
      properties:
        list:
          type: array
          description: 数据列表
          items:
            type: object
        total:
          type: integer
          example: 100
          description: 总记录数
        page:
          type: integer
          example: 1
          description: 当前页码
        pageSize:
          type: integer
          example: 10
          description: 每页数量

    DashboardStats:
      type: object
      properties:
        wallpapers:
          type: integer
          example: 1234
          description: 壁纸总数
        authors:
          type: integer
          example: 56
          description: 创作者数量
        categories:
          type: integer
          example: 23
          description: 分类数量
        wallpaperGrowth:
          type: number
          format: double
          example: 12.0
          description: 壁纸增长率（百分比）
        authorGrowth:
          type: number
          format: double
          example: 8.0
          description: 创作者增长率（百分比）
        categoryGrowth:
          type: number
          format: double
          example: 5.0
          description: 分类增长率（百分比）

    Dashboard:
      type: object
      properties:
        typeDistribution:
          type: array
          items:
            $ref: '#/components/schemas/TypeDistribution'
          description: 壁纸类型分布
        topAuthors:
          type: array
          items:
            $ref: '#/components/schemas/TopAuthor'
          description: 热门创作者TOP10
        uploadTrend:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UploadTrend'
          description: 上传趋势数据（week/month/year）
        monthlyCompare:
          $ref: '#/components/schemas/MonthlyCompare'
          description: 月度数据对比
        categoryTrend:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTrend'
          description: 分类热度趋势

    TypeDistribution:
      type: object
      properties:
        name:
          type: string
          example: 手机壁纸
          description: 类型名称
        value:
          type: integer
          example: 568
          description: 数量

    TopAuthor:
      type: object
      properties:
        id:
          type: integer
          example: 1
          description: 创作者ID
        name:
          type: string
          example: 张三
          description: 创作者昵称
        count:
          type: integer
          example: 156
          description: 作品数量

