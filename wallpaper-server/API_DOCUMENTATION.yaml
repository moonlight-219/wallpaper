        - 文件上传
      summary: 上传图片
      description: 上传图片文件，支持手机壁纸、平板壁纸、头像三种类型
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件【必填】
                type:
                  type: integer
                  description: 图片类型（默认1）
                  enum: [1, 2, 3]
                  default: 1
                  example: 1
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: 手机壁纸/平板壁纸返回
                    properties:
                      url:
                        type: string
                        description: 原始图片URL（高清原图）
                        example: https://wallpaper-project.oss-cn-beijing.aliyuncs.com/phone/abc123.jpg
                      thumbnailUrl:
                        type: string
                        description: 缩略图URL（列表展示用）
                        example: https://wallpaper-project.oss-cn-beijing.aliyuncs.com/phone/abc123.jpg?x-oss-process=image/resize,w_300,h_300
                      width:
                        type: integer
                        description: 图片宽度（像素）
                        example: 1920
                      height:
                        type: integer
                        description: 图片高度（像素）
                        example: 1080
                      format:
                        type: string
                        description: 图片格式（JPG、PNG等）
                        example: JPG
                      size:
                        type: integer
                        description: 文件大小（字节）
                        example: 2048000
                  - type: object
                    description: 头像返回
                    properties:
                      url:
                        type: string
                        description: 头像URL
                        example: https://wallpaper-project.oss-cn-beijing.aliyuncs.com/avatars/abc123.jpg

