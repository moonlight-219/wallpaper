openapi: 3.0.0
info:
  title: 壁纸系统API
  description: |
    壁纸系统后端接口文档
    
    ## 认证说明
    
    ### JWT Token认证
    系统使用JWT Token进行身份认证。登录成功后会返回Token，后续请求需要在请求头中携带Token。
    
    **请求头设置：**
    ```
    Authorization: Bearer <token>
    ```
    
    **示例：**
    ```
    Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjEsInVzZXJuYW1lIjoiYWRtaW4iLCJyb2xlIjoiYWRtaW4iLCJpYXQiOjE3MDAwMDAwMDAsImV4cCI6MTcwMDA4NjQwMH0.xxxxx
    ```
    
    **Token有效期：**
    - 默认有效期：24小时（86400000ms）
    - 本地开发环境：7天（604800000ms）
    
    **Token过期处理：**
    - Token过期后，接口会返回 `401` 错误码
    - 错误信息：`登录已过期，请重新登录`
    - 需要重新调用登录接口获取新Token
    
    ### 兼容性说明
    为了兼容旧版本，系统同时支持 `X-User-Id` 请求头（仅开发环境使用）。
    
    ## 错误码说明
    
    ### 成功 (200)
    - 200: 操作成功
    
    ### 用户相关错误 (1000-1099)
    - 1001: 用户不存在
    - 1002: 用户已存在
    - 1003: 用户名或密码错误
    - 1004: 微信未绑定
    - 1005: 用户无权限
    - 1006: 用户暂无创作权限
    
    ### 壁纸相关错误 (2000-2099)
    - 2001: 壁纸不存在
    - 2002: 壁纸上传失败
    - 2003: 壁纸删除失败
    - 2004: 壁纸状态无效
    
    ### 创作者相关错误 (3000-3099)
    - 3001: 创作者不存在
    
    ### 分类相关错误 (4000-4099)
    - 4001: 分类不存在
    - 4002: 分类已存在
    
    ### 专辑相关错误 (5000-5099)
    - 5001: 专辑不存在
    - 5002: 专辑创建失败
    - 5003: 专辑删除失败
    
    ### 作品集相关错误 (8000-8099)
    - 8001: 作品集不存在
    - 8002: 作品集创建失败
    - 8003: 无权操作此作品集
    
    ### 用户行为相关错误 (6000-6099)
    - 6001: 已操作过
    - 6002: 操作记录不存在
    
    ### 举报相关错误 (7000-7099)
    - 7001: 已举报过
    - 7002: 举报失败
    
    ### 参数相关错误 (8000-8099)
    - 8001: 参数错误
    - 8002: 缺少必要参数
    - 8003: 参数格式错误
    
    ### 系统相关错误 (9000-9099)
    - 9001: 数据库操作失败
    - 9002: 网络错误
    - 9003: 系统错误
    - 9004: 服务器内部错误
    
    ### 文件相关错误 (10000-10099)
    - 10001: 文件上传失败
    - 10002: 文件类型错误
    - 10003: 文件大小超出限制
    - 10004: 文件不存在
    
    ## 参数校验说明
    
    ### 必填参数标识
    - 路径参数：所有ID类型的路径参数都是必填的
    - 请求参数：标注了 `@NotNull` 或 `@NotBlank` 的参数是必填的
    - 请求体：标注了 `@Valid` 的请求体，其内部标注了校验注解的字段是必填的
    
    ### 参数校验规则
    - `@NotNull`: 参数不能为null
    - `@NotBlank`: 字符串参数不能为null、空字符串或只包含空白字符
    - `@Valid`: 请求体需要进行字段校验
    
    ### 参数校验失败响应
    当参数校验失败时，系统会返回以下格式的错误响应：
    
    ```json
    {
      "code": 8002,
      "message": "缺少必要参数: 参数名称",
      "data": null
    }
    ```
    
    ### 常见参数校验错误示例
    
    1. 缺少必填路径参数
       - 请求：`GET /api/user/` （缺少id）
       - 响应：`{"code": 8002, "message": "缺少必要参数: id", "data": null}`
    
    2. 缺少必填请求参数
       - 请求：`POST /api/wallpaper/like/1` （缺少userId）
       - 响应：`{"code": 8002, "message": "缺少必要参数: userId", "data": null}`
    
    3. 请求体字段为空
       - 请求：`POST /api/user/login`，body: `{"loginType": ""}`
       - 响应：`{"code": 8002, "message": "缺少必要参数: 登录方式不能为空", "data": null}`
    
    4. 多个参数缺失
       - 请求：`POST /api/wallpaper/upload`，body: `{"url": "", "type": null}`
       - 响应：`{"code": 8002, "message": "缺少必要参数: 壁纸地址不能为空, 壁纸类型不能为空", "data": null}`
  version: 1.0.0
servers:
  - url: http://localhost:9999
    description: 本地开发环境
tags:
  - name: 用户管理
    description: 用户相关接口
  - name: 管理员
    description: 管理员接口
  - name: 壁纸管理
    description: 壁纸相关接口
  - name: 创作者
    description: 创作者相关接口
  - name: 分类管理
    description: 分类相关接口
  - name: 广场
    description: 广场相关接口
  - name: 首页
    description: 首页相关接口
  - name: 文件上传
    description: 文件上传接口
  - name: 健康检查
    description: 健康检查接口
  - name: 作品集
    description: 作品集相关接口

paths:
  /api/user/login:
    post:
      tags:
        - 用户管理
      summary: 用户登录
      description: 支持微信登录和账号密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 用户名（账号密码登录）
                password:
                  type: string
                  description: 密码（账号密码登录）
                wechatOpenId:
                  type: string
                  description: 微信openId（微信登录）
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT Token，用于后续请求认证
                        example: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjEsInVzZXJuYW1lIjoiYWRtaW4iLCJyb2xlIjoiYWRtaW4ifQ.xxxxx
                      userId:
                        type: integer
                        example: 1
                      role:
                        type: string
                        example: user
                      isCreator:
                        type: boolean
                        example: true
                      username:
                        type: string
                        example: user123
                      nickname:
                        type: string
                        example: 小明
                      avatar:
                        type: string
                        example: /static/images/avatar1.jpg
                      followerCount:
                        type: integer
                        example: 100
                      workCount:
                        type: integer
                        example: 10
                      bio:
                        type: string
                        example: 个人简介

  /api/user/register:
    post:
      tags:
        - 用户管理
      summary: 用户注册
      description: 用户注册接口
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: 用户名
                password:
                  type: string
                  description: 密码
                nickname:
                  type: string
                  description: 昵称
                avatar:
                  type: string
                  description: 头像URL
                phone:
                  type: string
                  description: 手机号
                email:
                  type: string
                  description: 邮箱
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT Token，用于后续请求认证
                        example: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOjIsInVzZXJuYW1lIjoidXNlcjEyMyIsInJvbGUiOiJ1c2VyIn0.xxxxx
                      userId:
                        type: integer
                        example: 2
                      username:
                        type: string
                        example: user123
                      nickname:
                        type: string
                        example: 小明
                      role:
                        type: string
                        example: user

  /api/user/{id}:
    get:
      tags:
        - 用户管理
      summary: 获取用户信息和统计
      description: 根据用户ID获取用户信息和统计数据（包含作品数、点赞数、收藏数等）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 用户ID【必填】
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UserStats'

  /api/user/{userId}/downloads:
    get:
      tags:
        - 用户管理
      summary: 获取下载记录
      description: 获取用户的下载记录，支持分页
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: 用户ID【必填】
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 页码（从1开始）
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: 每页数量
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/DownloadRecord'
                      total:
                        type: integer
                        example: 100
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10

  /api/user/{userId}/uploads:
    get:
      tags:
        - 用户管理
      summary: 获取上传记录
      description: 获取用户的上传记录，支持按类型和状态筛选，支持分页
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
          description: 用户ID【必填】
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [phone, tablet, avatar]
          description: 一级分类类型（phone手机、tablet平板、avatar头像）
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
          description: 审核状态（0待审核、1已通过、2拒绝）
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 页码（从1开始）
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: 每页数量
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/UploadRecord'

  /api/admin/stats:
    get:
      tags:
        - 管理员
      summary: 获取首页统计数据
      description: 获取管理端首页的统计数据，包括壁纸总数、创作者数、分类数等
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/DashboardStats'

  /api/admin/dashboard:
    get:
      tags:
        - 管理员
      summary: 获取首页图表数据
      description: 获取管理端首页的图表数据，包括壁纸类型分布、热门创作者、上传趋势等
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Dashboard'

  /api/admin/users:
    get:
      tags:
        - 管理员
      summary: 获取所有用户
      description: 管理员获取所有用户列表，支持分页
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 页码（从1开始）
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: 每页数量
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      total:
                        type: integer
                        example: 100
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10

  /api/admin/user/{id}/creator-status:
    put:
      tags:
        - 管理员
      summary: 修改用户创作状态
      description: 管理员修改用户的创作权限
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 用户ID【必填】
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isCreator:
                  type: boolean
                  description: 是否支持创作【必填】
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /api/admin/wallpapers:
    get:
      tags:
        - 管理员
      summary: 获取壁纸列表
      description: 管理员获取壁纸列表，支持按审核状态筛选和分页
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 页码（从1开始）
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: 每页数量
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1, 2]
          description: 审核状态（0待审核、1已通过、2拒绝）
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/Wallpaper'
                      total:
                        type: integer
                        example: 100
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 10

  /api/admin/wallpaper/{id}/audit:
    put:
      tags:
        - 管理员
      summary: 审核壁纸
      description: 管理员审核壁纸，通过或拒绝
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 壁纸ID【必填】
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: integer
                  description: 审核状态【必填】
                  enum: [1, 2]
                reason:
                  type: string
                  description: 审核原因（拒绝时必填，最大500字符）
                  maxLength: 500
      responses:
        '200':
          description: 审核成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '8001':
          description: 壁纸不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 8001
                  message:
                    type: string
                    example: 壁纸不存在
                  data:
                    type: object
        '400':
          description: 审核状态无效
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: 审核状态只能是1（通过）或2（拒绝）
                  data:
                    type: object

  /api/admin/work/{id}/audit:
    put:
      tags:
        - 管理员
      summary: 审核作品集
      description: 管理员审核作品集。通过(status=1)则发布作品集，拒绝(status=2)则保存拒绝原因并删除作品集及其所有壁纸文件（包括OSS文件）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 作品集ID【必填】
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: integer
                  description: 审核状态【必填】
                  enum: [1, 2]
                reason:
                  type: string
                  description: 审核原因（拒绝时必填）
      responses:
        '200':
          description: 审核成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '8001':
          description: 作品集不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 8001
                  message:
                    type: string
                    example: 作品集不存在
                  data:
                    type: object
        '400':
          description: 审核状态无效或拒绝时未填写原因
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: 审核状态只能是approved或rejected，或拒绝审核必须填写原因
                  data:
                    type: object

  /api/admin/work/{id}/reject-reason:
    get:
      tags:
        - 管理员
      summary: 查询作品集拒绝原因
      description: 查询指定作品集的拒绝原因。只有当作品集状态为拒绝(status=2)时才能查询到拒绝原因
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: 作品集ID【必填】
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 成功
                  data:
                    type: string
                    example: 作品内容不符合规范
        '8001':
          description: 作品集不存在
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 8001
                  message:
                    type: string
                    example: 作品集不存在
                  data:
                    type: object
        '400':
          description: 作品集未被拒绝
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: 该作品集未被拒绝
                  data:
                    type: object

  /api/wallpaper/list:
    get:
      tags:
        - 壁纸管理
      summary: 获取壁纸列表
      description: 获取壁纸列表，支持按分类、类型筛选和分页，默认按创建时间降序排序。只返回可见的壁纸（已审核通过）
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: 页码（从1开始）
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: 每页数量
        - name: type
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 2, 3]
          description: 壁纸类型（1手机壁纸、2平板壁纸、3头像）
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
          description: 分类ID
        - name: userId
          in: query
          required: false
          schema:
            type: integer
          description: 用户ID
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 关键词搜索
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
